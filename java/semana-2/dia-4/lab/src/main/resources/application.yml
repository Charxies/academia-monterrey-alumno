# application.yml — config del proyecto (YAML: jerarquía por INDENTACIÓN de 2 espacios, nunca tabs).
#
# Estado STARTER (D4): SIN el bloque de persistencia todavía. Con spring-boot-starter-data-jpa + h2 en
# el classpath pero sin datasource configurado, Spring Boot autoconfigura una H2 EN MEMORIA — por eso
# la app ARRANCA igual. Ese es el contraste de MP-1: "miren, sin config ya hay una BD; ahora la hacemos
# NUESTRA y en ARCHIVO". El bloque de abajo se DESCOMENTA y completa en MP-1.
