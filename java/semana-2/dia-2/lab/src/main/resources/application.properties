# application.properties — el archivo que genera Spring Initializr (estado final de D1).
#
# HOY (S2D2) este archivo se MIGRA a application.yml en MP-8:
#   1) crea src/main/resources/application.yml con las 3 llaves de juguete
#      (server.port, spring.application.name, spring.main.banner-mode),
#   2) BORRA este .properties (si conviven, .properties PISA al .yml -> punto de dolor 9).
#
# La llave 'taskflow.seed.enabled' es la config externa STRETCH que heredaste de D1: el
# SeedRunner la lee con @Value("${taskflow.seed.enabled:true}"). Cuando en MP-4 borres el
# SeedRunner y actives el DataSeeder, esta llave deja de usarse.
spring.application.name=taskflow-api
taskflow.seed.enabled=true
