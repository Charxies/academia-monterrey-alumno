# ============================================================================
# PLAN B — Topología AWS simulada en LOCAL con Docker (S3D3)
#
# ESQUELETO CON TODOs. Parte de tu compose familiar de D2 (una sola red, con la
# BD publicando el 5432) y transfórmalo en la "muralla": DOS redes separadas que
# simulan los Security Groups de AWS. Cuando termines, desde el HOST:
#   - psql -h localhost -p 5432 ...  -> DEBE FALLAR  (db sin puertos = sin IP pública, como RDS)
#   - la API sí llega a db por su NOMBRE de servicio ('db') dentro de la red 'data'.
#
# Mapa mental (cada pieza de compose ≈ su equivalente AWS):
#   red 'data' privada            ≈ subnet privada / VPC sin ruta a internet
#   'db' SIN 'ports:'             ≈ RDS con "Public access: NO" (sin IP pública)
#   membresía de red (networks:)  ≈ Security Group (quién puede hablar con quién)
#   'api' en 'edge' + 'data'      ≈ la EC2 que da la cara a internet Y alcanza la BD
#
# La versión RESUELTA está en solucion/plan-b/docker-compose.topologia.yml.
# ============================================================================
services:
  api:
    image: taskflow-api:local          # la MISMA imagen de D2 (no se reconstruye)
    ports:
      - "8080:8080"                     # 'edge': la API sí da la cara (como el 8080 público de la EC2)
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db                       # llega a la BD por su NOMBRE de servicio (no localhost)
      DB_PORT: "5432"
      DB_NAME: taskflow
      DB_USER: ${POSTGRES_USER:-taskflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      JWT_SECRET: ${JWT_SECRET:-plan-b-secret-de-64-caracteres-solo-para-laboratorio-local-000}
    depends_on:
      db:
        condition: service_healthy
    # TODO (1): conecta 'api' a AMBAS redes — es la ÚNICA pieza que cruza de 'edge' a 'data'.
    #   networks:
    #     - edge
    #     - data

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"                     # TODO (2): BORRA estas 2 líneas. Sin publicar puertos = sin IP
                                        #   pública (como RDS "Public access: NO"). Es el corazón del lab.
    # TODO (3): conecta 'db' SOLO a la red 'data' (nunca a 'edge').
    #   networks:
    #     - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

# TODO (4): declara las DOS redes. 'edge' = expuesta (donde vive la cara pública);
#           'data' = privada (donde vive la BD). Descomenta:
# networks:
#   edge:
#     driver: bridge
#   data:
#     driver: bridge

# --- Mini-lab de síntomas (la tabla de diagnóstico, en local), una vez isolado: ---
#   docker compose -f docker-compose.topologia.yml pause db   -> la API: 'Connection timed out'
#       (el paquete muere en silencio, como un SG que no deja entrar)  ->  docker compose ... unpause db
#   apunta DB_PORT=5433 y reinicia la api  -> 'Connection refused' (llegaste y no hay nadie escuchando)
