<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Internet</title>
<!-- ============================================================
     Espejo local de https://the-internet.herokuapp.com/checkboxes
     DUEÑO: D2. Lo usan D2 (MP-4, Integrador obj 5-6) y D3 (MP-3:
     click condicional idempotente sobre checkboxes Y radios — los
     radios son extensión local, the-internet no los tiene).
     Contrato que los tests asertan (NO cambiar sin revisar specs):
       - exactamente DOS input[type='checkbox'] en la página     (D2 obj 5)
       - el SEGUNDO checkbox viene pre-marcado (checked)         (D2 obj 6, :nth-of-type(2))
       - grupo de radios en un form separado (#radios)           (D3 MP-3)
     ============================================================ -->
<style>
  body { margin: 2rem auto; max-width: 900px; padding: 0 1.5rem;
         font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: #2b2b2b; line-height: 1.9; }
  footer { margin-top: 3rem; border-top: 1px solid #ddd; color: #888;
           font-size: .85rem; padding-top: .75rem; line-height: 1.4; }
</style>
</head>
<body>
  <h3>Checkboxes</h3>
  <form id="checkboxes" data-testid="grupo-checkboxes">
    <input type="checkbox"> checkbox 1<br>
    <input type="checkbox" checked> checkbox 2
  </form>

  <h3>Radio Buttons (solo local)</h3>
  <form id="radios" data-testid="grupo-radios">
    <input type="radio" id="radio-basico" name="plan" value="basico">
    <label for="radio-basico">Plan Básico</label><br>
    <input type="radio" id="radio-pro" name="plan" value="pro" checked>
    <label for="radio-pro">Plan Pro</label><br>
    <input type="radio" id="radio-enterprise" name="plan" value="enterprise">
    <label for="radio-enterprise">Plan Enterprise</label>
  </form>

  <footer>Espejo local de the-internet.herokuapp.com/checkboxes — curso QE</footer>
</body>
</html>
