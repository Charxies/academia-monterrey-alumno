# Configuración del framework — se lee UNA vez desde el classpath (utils/Config).
# Regla: config FUERA del código. El mismo framework corre en otra máquina/ambiente
# sin tocar una línea Java; cada valor se puede sobreescribir por System property:
#   mvn test -Dheadless=true            (la llave de CI)
#   mvn test -DbaseUrl=http://otro:8080
baseUrl=http://localhost:8080
browser=chrome
headless=false
timeoutSeconds=10
