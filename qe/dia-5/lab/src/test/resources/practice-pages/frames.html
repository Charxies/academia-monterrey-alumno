<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Internet</title>
<!-- ============================================================
     Espejo local de https://the-internet.herokuapp.com/iframe
     DUEÑO: D3 (MP-5 y Integrador test 6 "escribeEnIframe").
     Contrato (mismos ids que the-internet/TinyMCE — el mismo test
     corre contra ambos):
       - iframe con id/name "mce_0_ifr" (srcdoc inline: sin archivos
         extra ni red; funciona vía file://)
       - DENTRO del iframe: body con id="tinymce" contenteditable,
         texto inicial "Your content goes here."
       - FUERA del iframe: h3 "An iFrame containing the TinyMCE
         WYSIWYG Editor" (assert tras defaultContent())
     Error intencional 2 de D3: buscar #tinymce SIN switchTo().frame()
     → NoSuchElementException "mentiroso" (DevTools sí lo muestra).
     ============================================================ -->
<style>
  body { margin: 2rem auto; max-width: 900px; padding: 0 1.5rem;
         font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: #2b2b2b; line-height: 1.5; }
  iframe { width: 100%; height: 240px; border: 1px solid #ccc; border-radius: 4px;
           background: #fff; }
  footer { margin-top: 3rem; border-top: 1px solid #ddd; color: #888;
           font-size: .85rem; padding-top: .75rem; }
</style>
</head>
<body>
  <h3>An iFrame containing the TinyMCE WYSIWYG Editor</h3>

  <iframe id="mce_0_ifr" name="mce_0_ifr" title="Rich Text Area"
          srcdoc="<html><head><style>body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;padding:1rem;margin:0;}</style></head><body id='tinymce' class='mce-content-body' contenteditable='true'><p>Your content goes here.</p></body></html>">
  </iframe>

  <footer>Espejo local de the-internet.herokuapp.com/iframe — curso QE</footer>
</body>
</html>
