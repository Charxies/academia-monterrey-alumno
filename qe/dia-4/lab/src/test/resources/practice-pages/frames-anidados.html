<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Internet</title>
<!-- ============================================================
     Espejo local de https://the-internet.herokuapp.com/nested_frames
     DUEÑO: D3 (MP-5: frames anidados = switch en cadena).
     Contrato (mismos NOMBRES de frame que the-internet):
       - frame-top (contiene frame-left / frame-middle / frame-right)
       - frame-bottom
       - dentro de frame-middle: <div id="content">MIDDLE</div>
     Ruta canónica del MP: switchTo().frame("frame-top") →
     switchTo().frame("frame-middle") → findElement(By.id("content")).
     Implementado con iframes srcdoc anidados (inline, file://-safe):
     el srcdoc externo va entre comillas dobles, los internos entre
     comillas simples y el id del div interno con &quot; escapadas.
     ============================================================ -->
<style>
  html, body { height: 100%; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  iframe { display: block; width: 100%; border: 0; }
  #frame-top { height: 60vh; border-bottom: 2px solid #999; }
  #frame-bottom { height: 38vh; }
</style>
</head>
<body>
  <iframe id="frame-top" name="frame-top"
          srcdoc="<html><head><style>body{margin:0;display:flex;height:100vh;}iframe{flex:1;border:0;border-right:2px solid #999;}iframe:last-child{border-right:0;}</style></head><body><iframe name='frame-left' srcdoc='<body style=&quot;font-family:sans-serif;padding:1rem;&quot;>LEFT</body>'></iframe><iframe name='frame-middle' srcdoc='<body style=&quot;font-family:sans-serif;padding:1rem;&quot;><div id=&quot;content&quot;>MIDDLE</div></body>'></iframe><iframe name='frame-right' srcdoc='<body style=&quot;font-family:sans-serif;padding:1rem;&quot;>RIGHT</body>'></iframe></body></html>">
  </iframe>
  <iframe id="frame-bottom" name="frame-bottom"
          srcdoc="<body style='font-family:sans-serif;padding:1rem;'>BOTTOM</body>">
  </iframe>
</body>
</html>
