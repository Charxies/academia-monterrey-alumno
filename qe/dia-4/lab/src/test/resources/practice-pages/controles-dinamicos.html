<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Internet</title>
<!-- ============================================================
     Espejo local de https://the-internet.herokuapp.com/dynamic_controls
     DUEÑO: D3 (MP-8: esperas sobre remove/enable + error intencional
     StaleElementReferenceException).
     Contrato (mismos ids/textos que the-internet):
       - form#checkbox-example con div#checkbox (checkbox " A checkbox")
         y botón "Remove"/"Add": al hacer Remove, tras ~1.5 s el div
         #checkbox se ELIMINA del DOM y #message dice "It's gone!";
         Add lo RECREA (nodo NUEVO → referencia cacheada = stale) y
         #message dice "It's back!"
       - form#input-example con input de texto DESHABILITADO y botón
         "Enable"/"Disable": tras ~1.5 s el input se habilita
         ("It's enabled!") o deshabilita ("It's disabled!")
       - #loading visible durante cada transición (1.5 s reales)
     ============================================================ -->
<style>
  body { margin: 2rem auto; max-width: 900px; padding: 0 1.5rem;
         font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: #2b2b2b; line-height: 1.5; }
  form { margin: 1.5rem 0; }
  button { background: #2c6e49; color: #fff; border: 0; border-radius: 6px;
           padding: .6rem 1.4rem; font-size: 1rem; cursor: pointer; display: block; margin-top: .75rem; }
  button:disabled { background: #9bb3a8; cursor: default; }
  input[type="text"] { padding: .5rem .6rem; border: 1px solid #bbb; border-radius: 4px;
                       font-size: 1rem; width: 280px; }
  input[type="text"]:disabled { background: #eee; }
  #loading { display: flex; align-items: center; gap: .75rem; color: #555; }
  .spinner { width: 28px; height: 28px; border: 4px solid #cfe0d8;
             border-top-color: #2c6e49; border-radius: 50%;
             animation: girar .8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  #message { font-weight: 600; color: #2c6e49; }
  footer { margin-top: 3rem; border-top: 1px solid #ddd; color: #888;
           font-size: .85rem; padding-top: .75rem; }
</style>
</head>
<body>
  <h3>Dynamic Controls</h3>
  <p>Los controles de esta página cambian tras un retraso REAL de ~1.5 s.</p>

  <h4>Remove/add</h4>
  <form id="checkbox-example">
    <div id="checkbox">
      <input type="checkbox"> A checkbox
    </div>
    <button type="button">Remove</button>
  </form>

  <hr>

  <h4>Enable/disable</h4>
  <form id="input-example">
    <input type="text" disabled>
    <button type="button">Enable</button>
  </form>

  <div id="loading" style="display:none">
    <div class="spinner"></div> Wait for it...
  </div>
  <p id="message" style="display:none"></p>

  <footer>Espejo local de the-internet.herokuapp.com/dynamic_controls — curso QE</footer>

<script>
(function () {
  'use strict';
  var RETRASO_MS = 1500;   // retraso REAL (rango 0.5-3 s de la spec de D3)
  var loading = document.getElementById('loading');
  var message = document.getElementById('message');
  var btnCheckbox = document.querySelector('#checkbox-example button');
  var btnInput = document.querySelector('#input-example button');
  var campo = document.querySelector("#input-example input[type='text']");

  function conCarga(boton, alTerminar) {
    boton.disabled = true;
    message.style.display = 'none';
    loading.style.display = 'flex';
    setTimeout(function () {
      loading.style.display = 'none';
      alTerminar();
      boton.disabled = false;
    }, RETRASO_MS);
  }

  function mostrarMensaje(texto) {
    message.textContent = texto;
    message.style.display = 'block';
  }

  btnCheckbox.addEventListener('click', function () {
    var existente = document.getElementById('checkbox');
    conCarga(btnCheckbox, function () {
      if (existente) {
        // Remove: el nodo se ELIMINA del DOM (las referencias cacheadas quedan stale).
        existente.parentNode.removeChild(existente);
        btnCheckbox.textContent = 'Add';
        mostrarMensaje("It's gone!");
      } else {
        // Add: se crea un nodo NUEVO (no se restaura el anterior) — a propósito:
        // reusar el WebElement viejo lanza StaleElementReferenceException.
        var div = document.createElement('div');
        div.id = 'checkbox';
        var chk = document.createElement('input');
        chk.type = 'checkbox';
        div.appendChild(chk);
        div.appendChild(document.createTextNode(' A checkbox'));
        document.getElementById('checkbox-example').insertBefore(div, btnCheckbox);
        btnCheckbox.textContent = 'Remove';
        mostrarMensaje("It's back!");
      }
    });
  });

  btnInput.addEventListener('click', function () {
    var habilitar = campo.disabled;
    conCarga(btnInput, function () {
      campo.disabled = !habilitar;
      btnInput.textContent = habilitar ? 'Disable' : 'Enable';
      mostrarMensaje(habilitar ? "It's enabled!" : "It's disabled!");
    });
  });
})();
</script>
</body>
</html>
